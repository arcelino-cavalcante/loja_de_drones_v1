<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja de Drones</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
    body { background:#f5f5f5; color:#333; overflow-x:hidden; }
    /* HEADER */
    header { background:#2f2f2f; padding:20px; display:flex; align-items:center; justify-content:center; position:relative; }
    header h1 { color:#fff; font-size:2em; font-weight:bold; letter-spacing:1px; }
    header img { position:absolute; right:20px; top:50%; transform:translateY(-50%); width:32px; cursor:pointer; filter:invert(80%) sepia(10%) saturate(300%) hue-rotate(80deg) brightness(1.1); }
    #cart-count { position:absolute; right:54px; top:50%; transform:translateY(-50%); background:#a8df65; color:#2f2f2f; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.8em; font-weight:bold; }
    /* GRID */
    main { padding:40px 20px; display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; max-width:1200px; margin:0 auto; }
    .product { background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 4px 8px rgba(0,0,0,.1); transition:transform .3s; cursor:pointer; display:flex; flex-direction:column; }
    .product:hover { transform:translateY(-5px); box-shadow:0 8px 16px rgba(0,0,0,.2); }
    .product img { width:100%; height:200px; object-fit:cover; opacity:1; transition:opacity .5s ease-in-out; }
    .product-info { padding:20px; flex-grow:1; display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; }
    .product-info h2 { font-size:1.3em; color:#2f2f2f; }
    .product-info p { font-size:.9em; color:#666; }
    .product .price { color:#a8df65; font-weight:bold; font-size:1.1em; }
    .product button { margin-top:auto; background:#a8df65; color:#2f2f2f; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; transition:background .3s; }
    .product button:hover { background:#8fcf4a; }
    /* CART */
    #cart { background:#fff; margin:40px auto; padding:20px; max-width:800px; border-radius:10px; box-shadow:0 4px 8px rgba(0,0,0,.1); }
    #cart h2 { text-align:center; margin-bottom:20px; color:#2f2f2f; }
    #cart ul { list-style:none; margin-bottom:20px; }
    .cart-item { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .cart-item span { flex-grow:1; }
    .qty-controls { display:flex; align-items:center; gap:6px; }
    .qty-btn { background:#a8df65; color:#2f2f2f; border:none; width:26px; height:26px; border-radius:4px; cursor:pointer; }
    .qty-btn:hover { background:#8fcf4a; }
    .remove-btn { background:#e74c3c; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; }
    .remove-btn:hover { background:#c0392b; }
    #checkout-btn { display:block; margin:20px auto; padding:15px 30px; background:#a8df65; color:#2f2f2f; font-size:1em; border:none; border-radius:8px; cursor:pointer; transition:background .3s; }
    #checkout-btn:hover { background:#8fcf4a; }
    /* POPUP */
    #popup { position:fixed; top:20px; right:20px; background:#a8df65; color:#2f2f2f; padding:10px 20px; border-radius:8px; font-size:.9em; display:none; z-index:3000; }
    /* MODALS */
    #modal, #modal-quantidade { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:2000; }
    .modal-box { background:#fff; padding:30px; border-radius:10px; max-width:480px; width:90%; text-align:center; animation:zoom .35s forwards; color:#333; }
    @keyframes zoom { from { transform:scale(.5); opacity:0; } to { transform:scale(1); opacity:1;} }
    .modal-box img { width:100%; height:auto; margin-bottom:10px; opacity:1; transition:opacity .5s ease-in-out; }
    .action-btn { margin-top:20px; background:#a8df65; color:#2f2f2f; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; transition:background .3s; }
    .action-btn:hover { background:#8fcf4a; }
    .qty-control { display:flex; align-items:center; justify-content:center; gap:18px; margin:18px 0; }
    .qty-value { font-size:1.2em; font-weight:bold; width:40px; text-align:center; }
  </style>
</head>
<body>
<header>
  <h1>Loja de Drones</h1>
  <img src="https://cdn-icons-png.flaticon.com/512/34/34568.png" alt="Carrinho"
       onclick="document.getElementById('cart').scrollIntoView({behavior:'smooth'})"/>
  <div id="cart-count">0</div>
</header>
<main id="product-list"></main>
<section id="cart">
  <h2>Seu Carrinho</h2>
  <ul id="cart-items"><li>Nenhum produto adicionado.</li></ul>
  <div id="cart-total"></div>
  <button id="checkout-btn">Finalizar Compra</button>
</section>
<div id="modal"><div id="modal-content" class="modal-box"></div></div>
<div id="modal-quantidade"><div id="modal-quantidade-content" class="modal-box"></div></div>
<div id="popup">Produto adicionado ao carrinho!</div>
<footer style="text-align:center;padding:20px;color:#666;font-size:.9em;">
  &copy; 2025 Loja de Drones
</footer>
<script>
  const produtos=[
    {nome:"Drone Explorer",descricao:"Vôo estável com câmera 4K.",preco:1299,imagens:["imagens/drone1-1.jpg","imagens/drone1-2.jpg","imagens/drone1-3.jpg"]},
    {nome:"Pro Flyer X",descricao:"Alcance de 5km e sensor de obstáculos.",preco:1599,imagens:["imagens/drone2-1.jpg","imagens/drone2-2.jpg","imagens/drone2-3.jpg"]},
    {nome:"Mini Sky",descricao:"Compacto e portátil, ótimo para iniciantes.",preco:499,imagens:["imagens/drone3-1.jpg","imagens/drone3-2.jpg","imagens/drone3-3.jpg"]},
    {nome:"Racing Drone",descricao:"Alta velocidade e frame leve.",preco:799,imagens:["imagens/drone4-1.jpg","imagens/drone4-2.jpg","imagens/drone4-3.jpg"]},
    {nome:"Foldable Pro",descricao:"Dobragem fácil, transporte prático.",preco:1399,imagens:["imagens/drone5-1.jpg","imagens/drone5-2.jpg","imagens/drone5-3.jpg"]},
    {nome:"CineDrone 8K",descricao:"Filmagens cinematográficas em 8K.",preco:2999,imagens:["imagens/drone6-1.jpg","imagens/drone6-2.jpg","imagens/drone6-3.jpg"]},
    {nome:"Agricultural",descricao:"Pulverização precisa para plantações.",preco:1899,imagens:["imagens/drone7-1.jpg","imagens/drone7-2.jpg","imagens/drone7-3.jpg"]},
    {nome:"Inspection",descricao:"Inspeção industrial com zoom 30x.",preco:2199,imagens:["imagens/drone8-1.jpg","imagens/drone8-2.jpg","imagens/drone8-3.jpg"]}
  ];
  const lista=document.getElementById('product-list');
  const cartItemsEl=document.getElementById('cart-items');
  const cartTotalEl=document.getElementById('cart-total');
  const cartCountEl=document.getElementById('cart-count');
  const popup=document.getElementById('popup');
  const modal=document.getElementById('modal');
  const modalContent=document.getElementById('modal-content');
  const modalQ=document.getElementById('modal-quantidade');
  const modalQContent=document.getElementById('modal-quantidade-content');
  let carrinho=[],currentIdx=null,currentQty=1;

  // Monta grid de produtos
  produtos.forEach((p,i)=>{
    const card=document.createElement('div'); card.className='product';
    const img=document.createElement('img'); img.src=p.imagens[0]; let k=0;
    setInterval(()=>{
      img.style.opacity=0;
      setTimeout(()=>{
        k=(k+1)%p.imagens.length;
        img.src=p.imagens[k];
        img.style.opacity=1;
      },250);
    },2000);
    const info=document.createElement('div'); info.className='product-info';
    info.innerHTML=`<h2>${p.nome}</h2><p>${p.descricao}</p><div class='price'>R$ ${p.preco.toFixed(2)}</div>`;
    const btn=document.createElement('button'); btn.textContent='Adicionar ao Carrinho';
    btn.onclick=e=>{e.stopPropagation(); abrirModalQuantidade(i);};
    info.appendChild(btn); card.appendChild(img); card.appendChild(info);
    card.onclick=()=>abrirModal(i); lista.appendChild(card);
  });

  // Modal detalhes
  function abrirModal(i){
    const p=produtos[i];
    modalContent.innerHTML=`<div id='galeria'></div><h2>${p.nome}</h2><p>${p.descricao}</p><div class='price'>R$ ${p.preco.toFixed(2)}</div><button class='action-btn' onclick='abrirModalQuantidade(${i})'>Adicionar ao Carrinho</button><br><button class='action-btn' onclick='modal.style.display=\"none\"'>Fechar</button>`;
    const gal=document.getElementById('galeria'); gal.innerHTML=''; let j=0;
    const gimg=document.createElement('img'); gimg.src=p.imagens[0]; gimg.style.opacity=1; gimg.style.transition='opacity .5s ease-in-out'; gal.appendChild(gimg);
    const it=setInterval(()=>{
      gimg.style.opacity=0;
      setTimeout(()=>{
        j=(j+1)%p.imagens.length;
        gimg.src=p.imagens[j];
        gimg.style.opacity=1;
      },250);
    },2000);
    modal.style.display='flex';
    modal.onclick=e=>{ if(e.target===modal){ modal.style.display='none'; clearInterval(it); } };
  }

  // Modal quantidade
  function abrirModalQuantidade(i){
    modal.style.display='none';
    currentIdx=i; currentQty=1;
    const p=produtos[i];
    modalQContent.innerHTML=`<h2>${p.nome}</h2><p>Quantidade:</p><div class='qty-control'><button class='qty-btn' onclick='changeQty(-1)'>&minus;</button><span id='qty-value' class='qty-value'>1</span><button class='qty-btn' onclick='changeQty(1)'>&#43;</button></div><button class='action-btn' onclick='confirmarCarrinho()'>Confirmar</button><br><button class='action-btn' onclick='modalQ.style.display=\"none\"'>Cancelar</button>`;
    modalQ.style.display='flex';
  }
  function changeQty(d){
    currentQty=Math.max(1,currentQty+d);
    document.getElementById('qty-value').textContent=currentQty;
  }

  // Confirmar adição
  function confirmarCarrinho(){
    carrinho.push({...produtos[currentIdx], quantidade: currentQty});
    modalQ.style.display='none';
    popup.style.display='block';
    setTimeout(()=>popup.style.display='none',2000);
    atualizarCarrinho();
  }

  // Atualizar carrinho
  function atualizarCarrinho(){
    cartItemsEl.innerHTML='';
    let total=0, Qt=0;
    carrinho.forEach((item,i)=>{
      const li=document.createElement('li');
      li.className='cart-item';
      li.innerHTML=`<span>${item.quantidade}x ${item.nome} - R$ ${(item.preco*item.quantidade).toFixed(2)}</span><div class='qty-controls'><button class='qty-btn' onclick='updateItemQty(${i},-1)'>&minus;</button><button class='qty-btn' onclick='updateItemQty(${i},1)'>&#43;</button></div><button class='remove-btn' onclick='removerItem(${i})'>Remover</button>`;
      cartItemsEl.appendChild(li);
      total+=item.preco*item.quantidade;
      Qt+=item.quantidade;
    });
    if(carrinho.length===0) cartItemsEl.innerHTML='<li>Nenhum produto adicionado.</li>';
    cartCountEl.textContent=Qt;
    cartTotalEl.innerHTML=`<strong>Total: R$ ${total.toFixed(2)}</strong>`;
  }
  function removerItem(i){ carrinho.splice(i,1); atualizarCarrinho(); }
  function updateItemQty(i,d){ carrinho[i].quantidade=Math.max(1,carrinho[i].quantidade+d); atualizarCarrinho(); }

  // Checkout WhatsApp
  document.getElementById('checkout-btn').addEventListener('click',()=>{
    if(carrinho.length===0){ alert('Carrinho vazio!'); return; }
    let msg='Olá! Pedido:\n', tot=0;
    carrinho.forEach(m=>{ msg+=`${m.quantidade}x ${m.nome} - R$ ${(m.preco*m.quantidade).toFixed(2)}\n`; tot+=m.preco*m.quantidade; });
    msg+=`\nTotal: R$ ${tot.toFixed(2)}`;
    window.open(`https://wa.me/5587981473819?text=${encodeURIComponent(msg)}`,'_blank');
  });
</script>
</body>
</html>
